name: Test project

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring openssl pdo pdo_mysql curl intl gd zip dom mysqli bcmath filter tokenizer session
          coverage: none

      
    